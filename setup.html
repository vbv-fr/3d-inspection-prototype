<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="edge.css">
<style>
html,body{height:100%;overflow:hidden}
#app{display:flex;height:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:#fff}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;flex:none}
.hd .crumbs{font-size:20px}
.bar3{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);flex:none;min-height:40px;flex-wrap:wrap}
.bar3 .tabs{margin:0;border:0}
.bar3 .tab{padding:9px 12px}
.bar3 .sp{flex:1}
.bar3 select.ip{padding:4px 7px;font-size:13px}
.rep{display:inline-flex;align-items:center;gap:4px}
.rep button.ic{width:28px;height:28px;border:1px solid #cfcbc7;border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.rep button.ic:hover{border-color:#a9a5a1}
.rep .cnt{font-size:12px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;display:grid;grid-template-columns:172px minmax(0,1fr) 316px}
.tools{background:var(--fill);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.tools h4{font-size:12px;color:var(--muted);font-weight:500;margin:0 6px 8px}
.tool{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 7px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 7px;margin-bottom:5px;align-items:center}
.tool:hover{border-color:#bdb9b5}
.tool.on{border-color:var(--primary);background:var(--primary-soft)}
.tool .ico{grid-row:span 2;width:24px;height:24px;border-radius:5px;background:#26231f;color:#fff;display:flex;align-items:center;justify-content:center}
.tool.on .ico{background:var(--primary)}
.tool .tn{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .tv{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:#b9b5b1;flex:none}
.dot.ok{background:#1f9d55}.dot.bad{background:#d92d20}.dot.warn{background:#d9a21b}
.cen{display:flex;flex-direction:column;min-width:0;min-height:0;background:#17191d}
.chips{display:flex;align-items:center;gap:5px;padding:6px 10px;background:#1f2227;flex:none;flex-wrap:wrap;min-height:36px}
.chips .l{font-size:11.5px;color:#aeb3b8;margin-right:3px}
.chip{border:1px solid #454a51;background:#2a2d33;color:#e4e6e9;border-radius:6px;padding:2px 8px;font-size:12px}
.chip:hover{border-color:#7c8087}
.chip.on{background:#fff;color:#111;border-color:#fff;font-weight:500}
.chip .ex{font-size:10.5px;opacity:.7;margin-left:4px}
.sk{display:flex;align-items:center;gap:14px;padding:5px 12px;background:var(--flat);color:var(--flat-ink);font-size:12.5px;flex:none;flex-wrap:wrap}
.sk b{font-weight:600}.sk label{display:inline-flex;align-items:center;gap:7px}
.sk input[type=range]{width:150px;accent-color:#38347a}
.pre{border:1px solid #38347a66;background:#fff;color:#38347a;border-radius:6px;padding:3px 10px;font-size:12.5px}
.pre.on{background:#38347a;color:#fff}
.panes{flex:1;min-height:0;display:flex;flex-direction:column;gap:1px;background:#000}
.pane{flex:1 1 0;min-height:60px;display:flex;flex-direction:column;background:#0e1013}
.ph{display:flex;align-items:center;gap:8px;padding:3px 10px;background:#1f2227;color:#d5d8dc;font-size:12px;flex:none;min-height:28px;flex-wrap:wrap}
.ph b{font-weight:500}
.ph .sp{flex:1}
.ph input[type=range]{width:170px;accent-color:#ff7a45;height:14px}
.ph .v{font-variant-numeric:tabular-nums;color:#fff;min-width:50px;display:inline-block}
.seg2{display:inline-flex;border:1px solid #454a51;border-radius:5px;overflow:hidden}
.seg2 button{border:0;background:#2a2d33;color:#c9cdd2;padding:1px 8px;font-size:11.5px}
.seg2 button+button{border-left:1px solid #454a51}
.seg2 button.on{background:#e4e6e9;color:#111;font-weight:500}
.cv{position:relative;flex:1;min-height:0;background:none;box-shadow:none}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.legend{display:inline-flex;gap:10px;align-items:center;font-size:11.5px;color:#c9cdd2;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;margin-right:4px;vertical-align:middle}
.outs{flex:none;background:#fff;border-top:1px solid var(--line);max-height:208px;overflow:auto}
.ot{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.ot th{position:sticky;top:0;background:var(--primary);color:#fff;font-weight:500;text-align:left;padding:4px 10px;white-space:nowrap;z-index:1}
.ot td{padding:4px 10px;border-top:1px solid var(--line);white-space:nowrap}
.ot tr.clk{cursor:pointer}.ot tr.clk:hover td{background:var(--primary-soft)}
.ot tr.sel td{background:var(--primary-soft)}
.stt{font-weight:600}.stt.ok{color:var(--ok)}.stt.bad{color:var(--bad)}.stt.warn{color:#b7791f}.stt.mut{color:var(--muted);font-weight:400}
.panel{display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid var(--line)}
.pscroll{flex:1;min-height:0;overflow-y:auto;padding:0 0 10px}
.pfoot{flex:none;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.ps{border-bottom:1px solid var(--line)}
.psh{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--fill);font-size:13px;font-weight:500}
.psh .sp{flex:1}
.psb{padding:8px 12px 10px}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;min-height:28px}
.f label{font-size:12.5px;color:#3f3b37}
.fc{display:flex;align-items:center;gap:5px;min-width:0}
.fc .u{font-size:11.5px;color:var(--muted);min-width:22px}
.ip.n{width:66px;padding:4px 6px;font-size:13px;font-variant-numeric:tabular-nums}
select.ip.s{padding:4px 6px;font-size:13px;max-width:170px}
input.sl{width:100%;accent-color:var(--primary);margin:0 0 6px}
.segc{display:inline-flex;border:1px solid #cfcbc7;border-radius:6px;overflow:hidden;width:100%}
.segc button{flex:1;border:0;background:#fff;padding:4px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.segc button+button{border-left:1px solid #cfcbc7}
.segc button.on{background:var(--primary);color:#fff;font-weight:500}
.card{border:1px solid var(--line);border-radius:8px;margin:8px 10px;overflow:hidden;padding:0}
.card.off .cb{display:none}
.ch{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--fill);font-weight:500;font-size:13px}
.ch .sp{flex:1}.cb{padding:8px 10px 4px}
.cval{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:8px}
.big.ok{background:var(--ok-soft);color:var(--ok)}.big.bad{background:var(--bad-soft);color:var(--bad)}.big.warn{background:var(--warn-soft);color:#7a5211}
.minic{height:150px;position:relative;margin-top:8px;border-radius:6px;overflow:hidden}
.minic canvas{position:absolute;inset:0;width:100%;height:100%}
.score{display:inline-flex;align-items:baseline;gap:6px;font-size:13px}
.score b{font-size:20px;font-weight:600}
.toast3{position:absolute;right:340px;bottom:70px;background:#111;color:#fff;padding:8px 14px;border-radius:7px;font-size:13px;z-index:50}
.prog{height:6px;border-radius:3px;background:#ececec;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--primary);width:0}
#modeSwitch{display:inline-flex}
</style>
</head>
<body>
<div id="app"></div>
<script src="chrome.js"></script>
<script src="sim.js"></script>
<script src="views.js"></script>
<script>
var SLUG = '3d-inspection';
var NX = Sim.NX, NY = Sim.NY, DX = Sim.DX, DY = Sim.DY;

function defaultCfg(capId) {
  var cp = Sim.capParams(capId), c = cp.c;
  function rule(n, where, gold, ref, minX, minY) { return { on: where === 'weld', name: n, where: where, gold: gold, ref: ref, size: 'xy', minX: minX, minY: minY, minA: 5, minV: 5, countOn: false, countN: 8, countA: 0.5 }; }
  return {
    peak: 'Best', exposure: 400, gain: 1, hdr: 'No HDR', exposures: '100, 500, 1000',
    filter: { gapX: 1, gapY: 1, median: 0, smooth: 0 },
    region: { mode: 'auto', y0: 14, y1: 166, minValid: 30, minLen: 40, margin: 1, ignore: [] },
    locate: { mode: 'max', b0: Math.round(c - 12), b1: Math.round(c + 12), find: 'peak', wl: 5, wr: 5, x0: c - 5, x1: c + 5, track: 'line', fixture: true },
    ref: { mode: 'roof', gap: 1.5, w: 6, top: 95, smooth: 5, absZ: 0 },
    golden: { on: true, ids: ['g1', 'g2', 'g3'] },
    merge: 0,
    rules: {
      spike: rule('Spike', 'weld', [-0.8, 0.8], [0.1, 3.7], 1, 3),
      height: rule('Height', 'weld', [-0.4, 0.4], [0.1, 3.4], 4, 10),
      gap: rule('Gap', 'weld', [-1.5, 99], [0.1, 99], 2, 3),
      spatter: rule('Spatter', 'beside', [-0.5, 0.5], [-0.5, 0.5], 0.5, 0.5)
    },
    nodata: { maxLen: 5, maxPct: 10, action: 'Not inspected' },
    measures: {
      crest: { on: false, name: 'Crest height', stat: 'Mean', lo: +(cp.H * 0.82).toFixed(2), hi: +(cp.H * 1.2).toFixed(2), inv: false, unit: 'mm' },
      width: { on: false, name: 'Weld width', stat: 'Mean', lo: +(cp.s * 2.0).toFixed(2), hi: +(cp.s * 2.8).toFixed(2), inv: false, unit: 'mm' },
      area: { on: false, name: 'Cross-section area', stat: 'Mean', lo: +(cp.H * cp.s * 2).toFixed(1), hi: +(cp.H * cp.s * 3).toFixed(1), inv: false, unit: 'mm²' },
      pos: { on: true, name: 'Weld position', stat: 'Mean', lo: +(c - 8).toFixed(1), hi: +(c + 8).toFixed(1), inv: false, unit: 'mm' }
    },
    hm: { background: 'Curved', height: 0.6, x0: 3, x1: 20, module: 'OCR_1' },
    boundary: { overlap: 0, merge: false }
  };
}
var DEFAULTS = {
  instanceName: 'Roof Weld 3D', team: 'Quality', variant: 'Variant A',
  captures: [{ id: 'c1', name: 'Capture 1' }, { id: 'c2', name: 'Capture 2' }],
  cap: 'c1', cfg: {}, sim: { tilt: 0, shift: 0 },
  view: { pal: 'colour', palR: 'ref', dim: '2d', yaw: -0.5, pitch: 1.0, zs: 4, scanMode: 'Video', mm: 'diff', replay: true, onlyWrong: false, saveRef: true, saveScatter: false, savePly: false },
  scanByStep: { laser: 'shiny', scans: 'g1', filters: 'shiny', region: 'g1', locate: 'shift', reference: 'tilt', golden: 'low', rules: 'crack', nodata: 'hole', measures: 'track', boundary: 'g1', test: 'g1', result: 'low', heightmap: 'stamp' },
  taken: 0
};

var query = new URLSearchParams(location.search);
var MODE = query.get('mode') === 'today' ? 'today' : 'after';
var STATE = query.get('state') || 'laser';
var inShell = false;
try { inShell = window.self !== window.top; } catch (e) { inShell = true; }
var KEY = SLUG + '-state';
function readShared() {
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  var out = Object.assign({}, DEFAULTS, saved);
  out.view = Object.assign({}, DEFAULTS.view, saved.view || {});
  out.sim = Object.assign({}, DEFAULTS.sim, saved.sim || {});
  out.scanByStep = Object.assign({}, DEFAULTS.scanByStep, saved.scanByStep || {});
  return out;
}
function writeShared(change) {
  var next = Object.assign(readShared(), change);
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
function goToStep(id) {
  if (inShell) parent.postMessage({ type: SLUG + '-nav', to: id }, '*');
  else if (id === 'capture') location.href = 'capture.html';
  else location.search = '?state=' + id;
}
window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) { S = readShared(); render(); } });

var S = readShared();
var TOOLS = [
  ['capture', 'Camera', '<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.4"/>'],
  ['laser', 'Laser View', '<path d="M2 17c3-9 5-9 7 0s4 0 6-4 5-4 7 0"/>'],
  ['scans', 'Scans', '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M9 4v16"/>'],
  ['filters', 'Filters', '<path d="M4 5h16l-6 8v6l-4-2v-4z"/>'],
  ['region', 'Region', '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>'],
  ['locate', 'Locate', '<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>'],
  ['reference', 'Reference', '<path d="M3 17h18"/><path d="M6 17V8M18 17V8" stroke-dasharray="2 2"/><path d="M3 8h6M15 8h6"/>'],
  ['golden', 'Golden Profile', '<path d="M2 18h5c3 0 3-12 5-12s2 12 5 12h5"/>'],
  ['rules', 'Checks', '<path d="M4 7l2 2 3-3M4 16l2 2 3-3M12 7h8M12 16h8"/>'],
  ['nodata', 'No Data', '<circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/>'],
  ['measures', 'Measures', '<path d="M3 16l13-13 5 5L8 21z"/><path d="M8 11l2 2M11 8l2 2M14 5l2 2"/>'],
  ['boundary', 'Capture Boundary', '<rect x="3" y="6" width="8" height="12"/><rect x="13" y="6" width="8" height="12"/>'],
  ['test', 'Test on Scans', '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>'],
  ['result', 'Result', '<path d="M4 12l5 5L20 6"/>'],
  ['heightmap', 'Height Map', '<path d="M3 20l6-10 4 6 3-4 5 8z"/>']
];
var CHIPS = {
  laser: ['shiny', 'g1'], filters: ['shiny', 'g1', 'hole'], region: ['g1', 'low'], locate: ['g1', 'shift', 'missing', 'track'],
  reference: ['g1', 'tilt', 'raised', 'shift'], golden: ['low', 'g1', 'spike', 'crack'], rules: ['crack', 'split', 'pores', 'spike', 'low', 'missing', 'spatter', 'g1'],
  nodata: ['hole', 'shiny', 'g1'], measures: ['track', 'low', 'g1'], result: ['low', 'spike', 'crack', 'hole', 'missing', 'g1'], scans: []
};
function capCfg(id) { if (!S.cfg[id]) S.cfg[id] = defaultCfg(id); return S.cfg[id]; }
function cfg() { var c = capCfg(S.cap); if (S.hdrBy && S.hdrBy[S.cap]) c.hdr = S.hdrBy[S.cap]; return c; }
function scanId() { return S.scanByStep[STATE] || 'g1'; }
function scanMeta(id) { return Sim.SCANS.filter(function (s) { return s.id === id; })[0] || { id: id, name: id, exp: '' }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function gv(path) { var o = path[0] === '$' ? S : cfg(), ks = path.replace(/^\$\./, '').split('.'); ks.forEach(function (k) { o = o == null ? o : o[k]; }); return o; }
function sv(path, v) { var o = path[0] === '$' ? S : cfg(), ks = path.replace(/^\$\./, '').split('.'); for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
function f2(v, n) { return v === v && v !== undefined && v !== null ? (+v).toFixed(n === undefined ? 2 : n) : '–'; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

/* ---------- small controls ---------- */
function num(p, o) { o = o || {}; return '<input class="ip n" type="number" aria-label="' + esc(o.a || p) + '" data-k="' + p + '" value="' + gv(p) + '" step="' + (o.step || 0.1) + '"' + (o.min !== undefined ? ' min="' + o.min + '"' : '') + (o.max !== undefined ? ' max="' + o.max + '"' : '') + '>'; }
function sli(p, a, b, st) { return '<input class="sl" type="range" aria-label="' + esc(p) + '" data-k="' + p + '" min="' + a + '" max="' + b + '" step="' + st + '" value="' + gv(p) + '">'; }
function sel(p, opts) { return '<select class="ip s" aria-label="' + esc(p) + '" data-k="' + p + '">' + opts.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (String(gv(p)) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>'; }
function tog(p, a) { return '<label class="tog"><input type="checkbox" aria-label="' + esc(a || p) + '" data-k="' + p + '"' + (gv(p) ? ' checked' : '') + '><i></i></label>'; }
function seg(p, opts) { return '<div class="segc" data-seg="' + p + '" role="group">' + opts.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<button type="button" data-v="' + esc(v) + '" class="' + (String(gv(p)) === String(v) ? 'on' : '') + '">' + esc(t) + '</button>'; }).join('') + '</div>'; }
function fld(l, c, u) { return '<div class="f"><label>' + l + '</label><div class="fc">' + c + (u !== undefined ? '<span class="u">' + u + '</span>' : '') + '</div></div>'; }
function sec(t, b, r) { return '<section class="ps"><div class="psh"><span>' + t + '</span><span class="sp"></span>' + (r || '') + '</div><div class="psb">' + b + '</div></section>'; }
function stat(s) { return s === 'ok' ? '<span class="stt ok">✓</span>' : s === 'bad' ? '<span class="stt bad">✕</span>' : s === 'warn' ? '<span class="stt warn">!</span>' : '<span class="stt mut">–</span>'; }
var REASON = { spike: 'Spike', height: 'Height', gap: 'Gap', spatter: 'Spatter', crest: 'Crest height', width: 'Weld width', area: 'Cross-section area', pos: 'Weld position', nodata: 'No data' };
function reasonText(a) { return a.map(function (k) { return REASON[k] || k; }).join(', '); }
function verdictTag(v) { return '<span class="stt ' + (v === 'OK' ? 'ok' : v === 'NG' ? 'bad' : 'warn') + '">' + v + '</span>'; }

/* ---------- panes ---------- */
function linePane() { return '<label style="display:inline-flex;align-items:center;gap:6px">Y <input id="lineR" type="range" min="0" max="' + (NY - 1) + '" step="1" value="' + (S.line || 180) + '"><span class="v" id="lineV"></span></label>'; }
function palSeg(ref, key) {
  key = key || 'pal';
  var o = [['colour', 'Colour'], ['gray', 'Grayscale']]; if (ref !== false) o.push(['ref', 'Reference']);
  return '<span class="seg2" data-g="$.view.' + key + '">' + o.map(function (x) { return '<button type="button" data-v="' + x[0] + '" class="' + (S.view[key] === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</span>';
}
function dimSeg() {
  var zs = S.view.dim === '3d' ? '<span class="seg2" data-g="$.view.zs" style="margin-left:6px">' + [1, 2, 4, 8].map(function (n) { return '<button type="button" data-v="' + n + '" class="' + (+S.view.zs === n ? 'on' : '') + '">Z×' + n + '</button>'; }).join('') + '</span>' : '';
  return '<span class="seg2" data-g="$.view.dim"><button type="button" data-v="2d" class="' + (S.view.dim !== '3d' ? 'on' : '') + '">Height map</button><button type="button" data-v="3d" class="' + (S.view.dim === '3d' ? 'on' : '') + '">3D</button></span>' + zs;
}
function pane(id, title, tools, style) { return '<div class="pane" style="' + (style || '') + '"><div class="ph"><b>' + title + '</b>' + (tools || '') + '</div><div class="cv"><canvas id="' + id + '" role="img" aria-label="' + esc(title) + '"></canvas></div></div>'; }
var XS = new Float32Array(NX); for (var ix = 0; ix < NX; ix++) XS[ix] = ix * DX;
var YS = new Float32Array(NY); for (var iy = 0; iy < NY; iy++) YS[iy] = iy * DY;
function row(z, j) { return z.subarray(j * NX, (j + 1) * NX); }
function zRange(z) { return Views.autoRange(z); }

/* ---------- compute with memory ---------- */
var R = null, lastKey = '';
function compute() {
  var k = JSON.stringify([S.cap, scanId(), cfg(), S.sim]);
  if (k !== lastKey || !R) { R = Sim.run(S.cap, scanId(), cfg(), S.sim); lastKey = k; }
  return R;
}
function interesting(id) {
  var m = { spike: 68, low: 100, crack: 88, split: 100, missing: 112, hole: 124, track: 110 };
  if (m[id]) return Math.round(m[id] / DY);
  if (id === 'shiny') {
    var scan = Sim.genScan(S.cap, id, { exposure: cfg().exposure, hdr: cfg().hdr }), best = 180, bn = 0;
    for (var j = 0; j < NY; j++) { var n = 0; for (var i = 0; i < NX; i++) if (scan.gs[j * NX + i] === 2) n++; if (n > bn) { bn = n; best = j; } }
    return best;
  }
  return Math.round(90 / DY);
}

    '<div class="tabs" role="tablist">' + S.captures.map(function (x) { return '<button type="button" class="tab ' + (x.id === S.cap ? 'on' : '') + '" role="tab" data-cap="' + x.id + '">' + esc(x.name) + '</button>'; }).join('') + '</div><span class="sp"></span>' + scanSel + replay + '</div>' +
    '<div class="body"><aside class="tools" id="tools"></aside><div class="cen">' + (st.sketch ? st.sketch() : '') + chips + '<div class="panes" id="panes">' + st.layout() + '</div><div class="outs" id="outs"></div></div>' +
    '<aside class="panel"><div class="pscroll" id="pscroll">' + st.panel() + '</div><div class="pfoot"><button type="button" class="b ghost" data-go="' + (prev || '') + '"' + (prev ? '' : ' disabled') + '>Back</button><button type="button" class="b" data-go="' + (next || '') + '"' + (next ? '' : ' disabled') + '>Save and Next</button></div></aside></div></div>';
  if (S.line === undefined) S.line = interesting(cur);
  if (st.bind) st.bind();
  else { bindLine(); if (document.getElementById('map')) bindMapLine('map'); }
  refresh();
}

/* ---------- events ---------- */
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-k');
  if (k && (e.target.type === 'number' || e.target.type === 'range')) {
    var v = parseFloat(e.target.value); if (v !== v) return;
    sv(k, v); S.preset = null;
    document.querySelectorAll('[data-k="' + k + '"]').forEach(function (o) { if (o !== e.target) o.value = v; });
    schedule();
  } else if (k && e.target.type === 'text') { sv(k, e.target.value); save(); }
  var g2 = e.target.getAttribute && e.target.getAttribute('data-g2');
  if (g2) {
    var n = parseFloat(e.target.value); sv(g2, n);
    var a = document.getElementById('shiftV'), b = document.getElementById('tiltV');
    if (a) a.textContent = S.sim.shift + ' mm'; if (b) b.textContent = S.sim.tilt + '°';
    schedule();
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-k');
  if (t.id === 'scSel') return setScan(t.value);
  if (t.getAttribute && t.getAttribute('data-good')) {
    var ids = cfg().golden.ids, id = t.getAttribute('data-good'), at = ids.indexOf(id);
    if (t.checked && at < 0) ids.push(id); if (!t.checked && at >= 0) ids.splice(at, 1);
    schedule(); return;
  }
  if (!k) return;
  if (t.type === 'checkbox') sv(k, t.checked);
  else if (t.tagName === 'SELECT') { sv(k, t.value); if (k === 'hdr') { S.hdrBy = S.hdrBy || {}; S.hdrBy[S.cap] = t.value; } }
  else return;
  fullRender();
});
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-go]'))) { var g = b.getAttribute('data-go'); if (g) { save(); goToStep(g); } return; }
  if ((b = t.closest('[data-seg] button'))) {
    var p = b.parentNode.getAttribute('data-seg'), v = b.getAttribute('data-v');
    sv(p, v === 'true' ? true : v === 'false' ? false : v); fullRender(); return;
  }
  if ((b = t.closest('[data-g] button'))) { sv(b.parentNode.getAttribute('data-g'), b.getAttribute('data-v')); fullRender(); return; }
  if ((b = t.closest('[data-preset]'))) { applyPreset(b.getAttribute('data-preset')); return; }
  if ((b = t.closest('[data-chip]'))) { setScan(b.getAttribute('data-chip')); return; }
  if ((b = t.closest('[data-cap]'))) { S.cap = b.getAttribute('data-cap'); capCfg(S.cap); lastKey = ''; testRows = null; testScore = null; S.line = undefined; save(); render(); return; }
  if ((b = t.closest('[data-scan]'))) { setScan(b.getAttribute('data-scan')); return; }
  if ((b = t.closest('[data-testscan]'))) { S.scanByStep.result = b.getAttribute('data-testscan'); S.line = interesting(S.scanByStep.result); save(); goToStep('result'); return; }
  if ((b = t.closest('[data-blob]'))) { S.line = +b.getAttribute('data-blob') + 2; schedule(); return; }
  if ((b = t.closest('[data-setmm]'))) { var k = b.getAttribute('data-setmm'), m = cfg().measures[k], vv = compute().msr[k].med; m.lo = +(vv * 0.95).toFixed(2); m.hi = +(vv * 1.05).toFixed(2); m.on = true; fullRender(); return; }
  if ((b = t.closest('[data-delzone]'))) { cfg().region.ignore.splice(+b.getAttribute('data-delzone'), 1); fullRender(); return; }
  if (t.id === 'addZone') { cfg().region.ignore.push({ y0: 80, y1: 90 }); fullRender(); return; }
  if (t.id === 'scPrev' || t.closest('#scPrev') || t.id === 'scNext' || t.closest('#scNext')) {
    var l = Sim.SCANS.filter(function (s) { return !s.hidden; }), i = l.map(function (s) { return s.id; }).indexOf(scanId()), d = t.closest('#scPrev') ? -1 : 1;
    setScan(l[(i + d + l.length) % l.length].id); return;
  }
  if (t.id === 'buildG') { lastKey = ''; fullRender(); return; }
  if (t.id === 'takeBtn') {
    var pr = document.getElementById('prog'), bar = pr.firstChild; pr.hidden = false; t.disabled = true; t.textContent = 'Scanning…';
    var st = Date.now(), iv = setInterval(function () { var q = (Date.now() - st) / 1500; bar.style.width = Math.min(100, q * 100) + '%'; if (q >= 1) { clearInterval(iv); S.taken++; fullRender(); } }, 50);
    return;
  }
  if (t.id === 'suggest') {
    var c = cfg(), max = 0;
    c.golden.ids.forEach(function (id) { var r = Sim.run(S.cap, id, c, {}); for (var q = 0; q < r.delta.length; q++) { var a = Math.abs(r.delta[q]); if (a === a && a > max && a < 3) max = a; } });
    var h = Math.round(max * 1.3 * 20) / 20, sp = Math.round(max * 2.2 * 20) / 20;
    c.rules.height.gold = [-h, h]; c.rules.spike.gold = [-sp, sp];
    fullRender(); return;
  }
});
window.addEventListener('resize', function () { schedule(); });

/* the 3D view rotates wherever a height map pane is shown */
capCfg(S.cap);
S.line = interesting(scanId());
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { schedule(); });
</script>
</body>
</html>
